<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manajemen Tugas Tim</title>
  <!-- <link rel="stylesheet" href="style.css"> -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-800">
  <p id="connection-status" class="mt-3 text-xs text-indigo-100" aria-live="polite">Memeriksa koneksi...</p>
  
  <main class="mx-auto grid max-w-6xl gap-6 px-5 py-8 md:grid-cols-[280px_1fr]">
    <aside class="rounded-2xl bg-white p-5 shadow-sm">
      <h2 class="text-lg font-bold">Anggota Tim</h2>
      <p class="mt-1 text-sm text-slate-500">Pilih anggota untuk melihat tugasnya.</p>
      <p id="users-status" class="mt-4 text-sm text-slate-500">Memuat anggota...</p>
      <div id="users-list" class="mt-3 flex flex-col gap-2"></div>
    </aside>

    <section class="rounded-2xl bg-white p-5 shadow-sm sm:p-6">
      <div class="flex flex-col justify-between gap-3 sm:flex-row sm:items-start">
        <div>
          <h2 id="tasks-heading" class="text-xl font-bold">Pilih anggota tim</h2>
          <p id="progress" class="mt-1 text-sm text-slate-500">Progres tugas akan ditampilkan di sini.</p>
        </div>
        <span id="task-count" class="w-fit rounded-full bg-indigo-50 px-3 py-1 text-sm font-medium text-indigo-700">0 tugas</span>
      </div>

      <div class="mt-5">
        <label for="search-input" class="mb-2 block text-sm font-medium">Cari tugas</label>
        <input id="search-input" type="search" placeholder="Ketik judul tugas..."
          class="w-full rounded-xl border border-slate-300 px-4 py-3 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100">
      </div>

      <p id="tasks-status" class="mt-4 text-sm text-slate-500">Pilih anggota terlebih dahulu.</p>
      <p id="search-empty" class="mt-4 hidden text-sm text-slate-500">Tidak ada tugas yang cocok.</p>
      <div id="tasks-list" class="mt-3 flex flex-col gap-3"></div>

      <div class="mt-8 border-t border-slate-200 pt-6">
        <h3 class="text-lg font-bold">Tambah Tugas Baru</h3>
        <p class="mt-1 text-sm text-slate-500">Judul tugas minimal 5 karakter.</p>
        <form id="task-form" class="mt-4 flex flex-col gap-3 sm:flex-row">
          <input id="task-title" type="text" placeholder="Contoh: Membuat laporan mingguan"
            class="min-w-0 flex-1 rounded-xl border border-slate-300 px-4 py-3 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100">
          <button id="save-button" type="submit"
            class="rounded-xl bg-indigo-600 px-5 py-3 font-semibold text-white hover:bg-indigo-700 disabled:cursor-not-allowed disabled:opacity-50">Simpan</button>
        </form>
        <p id="form-message" class="mt-3 text-sm" aria-live="polite"></p>
        <p id="notification" class="mt-2 hidden rounded-lg bg-green-50 px-3 py-2 text-sm text-green-700" aria-live="polite"></p>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
